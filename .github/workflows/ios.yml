name: iOS simulator

# iOS Simulator build + launch smoke test on a GitHub-hosted macOS runner.
# No Apple Developer account, no signing (CODE_SIGNING_ALLOWED=NO), no upload.
# A simulator run is NOT device evidence: G1 still needs a real iPhone.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
      - 'scripts/ci/ios-sim-smoke.sh'
  push:
    branches: [main, 'claude/**']
    paths:
      - 'ios/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
      - 'scripts/ci/ios-sim-smoke.sh'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iOS simulator build + launch
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select newest installed Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install, build web, sync iOS
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Build for simulator (unsigned)
        run: scripts/ci/ios-sim-smoke.sh build

      - name: Boot simulator, install, launch, screenshot, alive check
        run: scripts/ci/ios-sim-smoke.sh run

      - name: Summary
        if: always()
        run: |
          {
            echo "### iOS simulator – ${GITHUB_SHA::7}"
            grep -E '^\*\* (BUILD|ARCHIVE) ' reports/xcodebuild.log || echo "no xcodebuild result line"
            cat reports/launch.txt 2>/dev/null || echo "not launched"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-reports-${{ github.sha }}
          path: reports/
          retention-days: 14
