name: CI

# Verification only. Nothing here signs a release or uploads to App Store / Google Play.
on:
  pull_request:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail: a failure piped through tee still fails the step
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      - name: Production build
        run: npm run build 2>&1 | tee reports/build.log
      - name: Release check (no test content, no demo data, CSP present)
        run: npm run check:release
      - name: Secret scan
        run: npm run check:secrets
      - name: Dependency licenses
        run: npm run check:licenses 2>&1 | tee reports/licenses.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### MitzvotPlus CI – ${GITHUB_SHA::7}"
            echo "- Node: $(node -v)"
            echo "- Tests: $(grep -o 'tests=\"[0-9]*\"' reports/junit.xml | head -1) $(grep -o 'failures=\"[0-9]*\"' reports/junit.xml | head -1)"
            echo "- Build: $(grep -c 'built in' reports/build.log || true) successful build(s)"
            echo '```'; cat reports/licenses.log || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports
          path: reports/
          retention-days: 30

  android-debug:
    name: Android debug build + 16 KB check
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web + sync Capacitor
        run: npm run build && npx cap sync android
      - name: Assemble debug APK (unsigned for release)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: 16 KB page-size check
        run: scripts/ci/check-16kb.sh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
