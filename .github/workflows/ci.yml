name: CI

# Verification only. Nothing here signs a release or uploads to App Store / Google Play.
on:
  pull_request:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail: a failure piped through tee still fails the step
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      - name: Production build
        env:
          VITE_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build 2>&1 | tee reports/build.log
      - name: Build identification (compare with "אודות האפליקציה")
        run: node scripts/build-info.mjs | tee reports/build-info.json
      - name: Release check (no test content, no demo data, CSP present)
        run: npm run check:release
      - name: Secret scan
        run: npm run check:secrets
      - name: Dependency licenses
        run: npm run check:licenses 2>&1 | tee reports/licenses.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### MitzvotPlus CI – ${GITHUB_SHA::7}"
            echo "- Node: $(node -v)"
            echo "- Source fingerprint: $(node -p "require('./reports/build-info.json').fingerprint" 2>/dev/null || echo n/a)"
            echo "- Tests: $(grep -o 'tests=\"[0-9]*\"' reports/junit.xml | head -1) $(grep -o 'failures=\"[0-9]*\"' reports/junit.xml | head -1)"
            echo "- Build: $(grep -c 'built in' reports/build.log || true) successful build(s)"
            echo '```'; cat reports/licenses.log || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports
          path: reports/
          retention-days: 30

  database:
    name: Database – migrations, RLS and server functions (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations + negative permission tests (fails on any assertion)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node scripts/db/test-db.mjs
      - name: Fault injection – the same tests must FAIL on a deliberately broken schema
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          DB_FAULT: supabase/tests/fault-injection.sql
        run: "! node scripts/db/test-db.mjs > /dev/null"
      - name: Fault injection, round 13 – backup generation and goal versions (must FAIL)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          DB_FAULT: supabase/tests/fault-injection-r13.sql
        run: "! node scripts/db/test-db.mjs > /dev/null"
      - name: Integration – the app's account + sync code against the local Supabase stand-in
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run test:integration
      - name: Install Chromium for Playwright (version from package-lock)
        run: npx playwright install --with-deps chromium
      - name: Browser rehearsal of a staging build (CSP, sign-in, data spaces, consent, deletion)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run e2e:staging

  e2e:
    name: End-to-end scenarios (production build)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright (version from package-lock)
        run: npx playwright install --with-deps chromium
      - name: E2E on the production build (fails on any assertion or console error)
        env:
          VITE_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p reports
          npm run build
          node scripts/e2e/scenarios.mjs --shots reports/e2e-shots 2>&1 | tee reports/e2e.txt
      - name: Design round 1.1 regressions (undo of the right entry, blessing goal, partial progress, 44px)
        run: node scripts/e2e/round-1-1.mjs --with-demo 2>&1 | tee reports/round-1-1.txt
      - name: Round 13 – core fixes (habit editor, dialogs, minyan choice, double tap, every entry reachable)
        run: node scripts/e2e/round-13.mjs 2>&1 | tee reports/round-13.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ github.sha }}
          path: reports/
          retention-days: 14

  android-debug:
    name: Android debug build + 16 KB check
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          # Cache Gradle dependencies: fewer downloads, no failures when Maven Central rate-limits.
          cache: gradle
      - run: npm ci
      - name: Build web + sync Capacitor
        env:
          VITE_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build && npx cap sync android
      - name: Assemble debug APK (unsigned for release)
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon
      - name: 16 KB page-size check
        run: scripts/ci/check-16kb.sh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build identity of this APK (write its buildId into test_evidence.csv after a device test)
        run: |
          node scripts/build-info.mjs --identity debug --artifact android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/build-identity.json
          echo "### APK build identity" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat android/app/build/outputs/apk/debug/build-identity.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/build-identity.json
          retention-days: 14
