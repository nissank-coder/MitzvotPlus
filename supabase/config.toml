# Supabase CLI – LOCAL development only (`supabase start`). Hosted staging/production projects are
# created by the owner (EU region, e.g. Frankfurt, pending approval) and configured in their dashboard.
project_id = "mitzvotplus"

[db]
major_version = 16

[auth]
enabled = true
site_url = "http://localhost:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Round 13: the only addresses a social sign-in may return to – the app's own link and the local
# web page. Anything else falls back to site_url (never a foreign site).
additional_redirect_urls = ["mitzvotplus://auth/callback", "http://localhost:3000/?auth=callback"]

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.rate_limit]
email_sent = 4
token_verifications = 30

# The e-mail carries the 6-digit code only (no link, no redirect, no deep link).
[auth.email.template.magic_link]
subject = "קוד הכניסה שלך למצוות+"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "קוד הכניסה שלך למצוות+"
content_path = "./supabase/templates/confirmation.html"

# Only the "public" schema is exposed by the API; the helper schema "private" must never be added.
[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

# Round 13: Google / Apple next to guest use – OFF until the owner configures the providers.
# Client secrets are never in this file or the app: env() reads them from the CLI's environment
# (local) or they are entered in the hosted project's dashboard (staging).
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
